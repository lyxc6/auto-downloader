name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate build info
        run: |
          $sha = git rev-parse --short HEAD
          $buildTime = Get-Date -Format "yyyy-MM-ddTHH:%M:%SZ" -AsUTC
          $channel = if ($env:GITHUB_REF -match "^refs/tags/v") { "stable" } else { "test" }
          
          $content = @"
          """构建元数据 - 由 CI/CD 自动生成"""
          
          BUILD_TIME: str = "$buildTime"
          GIT_SHA: str = "$sha"
          BUILD_CHANNEL: str = "$channel"
          "@
          
          Set-Content -Path "src/_build_info.py" -Value $content -Encoding UTF8

      - name: Build with PyInstaller
        run: pyinstaller 自动下载器.spec

      - name: Get short SHA and date
        if: "!startsWith(github.ref, 'refs/tags/')"
        id: slug
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT
          echo "date=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_OUTPUT

      - name: Create Pre-release (push to main)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          name: "自动下载器 test-${{ steps.slug.outputs.date }}-${{ steps.slug.outputs.sha }}"
          tag_name: "test-${{ steps.slug.outputs.date }}-${{ steps.slug.outputs.sha }}"
          draft: false
          prerelease: true
          files: dist/自动下载器.exe

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "自动下载器 ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: dist/自动下载器.exe
